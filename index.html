<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel = "stylesheet" href = "styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id = "container">
        <div id = "header">
            <div id = "leftHeader">
            <div class="w-3 h-3 rounded-full bg-current animate-ping" id = "radar"></div>
                <h1>WIN OS // CHRONO // MONITOR_v2.3</h1>
            </div>
            <div id = "rightHeader">
                
            </div>
        </div>
        <div id = "drawContainer">
            <canvas id = "drawBoard"></canvas>
        </div>
        <div id = "clockContainer">
            <div id = "clock">00:00:00</div>
            <button id = "setTime">Set Time</button>
            <div id = "editTime">
                <h2>Set the time you want</h2>
                <input id = "inputHours" type = "text" placeholder="hours">
                <input id = "inputMinutes" type = "text" placeholder="minutes">
                <input id = "inputSeconds"type = "text" placeholder="seconds">
                <select id = "selectTime">
                    <option value = "AM">AM</option>
                    <option value = "PM">PM</option>
                </select>
                <button id = "submit" type = "submit">Submit</button>
            </div>
        </div>
    </div>



    <script src = "script.js"></script>
</body>
</html>
