<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel = "stylesheet" href = "styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id = "body">
    <div id = "container">
        <div id = "header">
            <div id = "leftHeader">
            <div class="w-3 h-3 rounded-full bg-current animate-ping" id = "radar"></div>
                <h1>WIN OS // CHRONOS // MONITOR_v2.3</h1>
            </div>
            <div id = "rightHeader">
                <h1>STATUS: <h1 id = "status"> STABLE</h1></h1>
                <button id = "control">[ CONTROL_PANEL ]</button>
                <div id = "controlMenu">

                    <div id = "menuHeader" >
                        <div class = "buttonGroup" style = "justify-content: space-between;">
                            <button id = "guide" style = "text-decoration: 3px underline;">CONTROL PANEL</button>
                            <button id = "X">X</button>
                        </div>
                    </div>

                    <div id = "frequencyContainer">
                        <h1 style = "padding-left: 20px;">FREQUENCY: <h1 id = "frequency" style = "margin-left:15px; text-decoration: 5px underline ;">LOW</h1></h1>
                    </div>
                    <div id = "sanityContainer">
                        <h1 style = "padding-left: 20px;">SANITY: <h1 id = "sanity" style = "margin-left:15px;">55%</h1></h1>
                    </div>
                    <div id = "sanityBar">
                        <div class = "progress" id = "sanityProgress"></div>
                    </div>
                    <br>
                    <div id = "actions">
                        <h1>Actions</h1>
                        <button class = "actionBtns"></button>
                        <button class = "actionBtns"></button>
                        <button class = "actionBtns"></button>
                        <button class = "actionBtns"></button>
                    </div>

                    <div id = "editSpeed">
                        <h1>Speed</h1>
                        <input type = "text" placeholder = "How many times faster">
                    </div>
                </div>
            </div>
        </div>
        <div id = "drawContainer">
            <canvas id = "drawBoard"></canvas>
        </div>
        <div id = "clockContainer">
            <div id = "clock">00:00:00</div>
            <div class = "buttonGroup">
                <button id = "setTime">Set Time</button>
                <button id = "reset">Reset</button>    
            </div>
            <div id = "editTime">
                <input id = "inputHours" type = "text" placeholder="hours">
                <input id = "inputMinutes" type = "text" placeholder="minutes">
                <input id = "inputSeconds"type = "text" placeholder="seconds">
                <select id = "selectTime">
                    <option value = "AM">AM</option>
                    <option value = "PM">PM</option>
                </select>
                <div class = "buttonGroup">
                    <button id = "submit" type = "submit">Submit</button>
                    <button id = "close" type = "submit">Close</button>
                </div>
            </div>
        </div>
    </div>



    <script src = "script.js"></script>
</body>
</html>
